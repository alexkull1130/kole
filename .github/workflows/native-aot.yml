name: NativeAOT host integration

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'include/**'
      - 'examples/native-host/**'
      - '.github/workflows/native-aot.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'include/**'
      - 'examples/native-host/**'
      - '.github/workflows/native-aot.yml'

jobs:
  native-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Publish the Kole embedding library
        run: dotnet publish native/Kole.Embedding.csproj -c Release -r win-x64 -o native-artifacts
      - name: Compile the dynamically loaded C host
        shell: pwsh
        run: |
          cl /nologo /I include examples/native-host/host.c /link /OUT:native-host.exe
      - name: Run the native host integration test
        shell: pwsh
        run: |
          $nativeOutput = 'native-artifacts'
          $dll = Get-ChildItem $nativeOutput -Recurse -Filter 'kole_embedding.dll' | Select-Object -First 1
          if ($null -eq $dll) { throw 'NativeAOT did not produce a Kole embedding DLL.' }
          $env:PATH = "$($dll.DirectoryName);$env:PATH"
          $PSNativeCommandUseErrorActionPreference = $false
          & ./native-host.exe
          $code = $LASTEXITCODE
          if (Test-Path native-host-report.txt) { Get-Content native-host-report.txt }
          exit $code
